name: Inserto settimanale Telegram (manuale)

# Il trigger automatico è nel workflow del gazzettino (daily-report.yml):
# la domenica notte, subito dopo aver inviato il gazzettino, chiama lo
# stesso endpoint da qui sotto. Questo workflow resta solo per lanciarlo
# a mano quando serve provarlo o forzarlo fuori dal solito giro.
on:
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama l'endpoint del bot per pubblicare l'inserto
        run: |
          curl -sS -X POST \
            --fail \
            -H "X-Trigger-Secret: ${{ secrets.TELEGRAM_BOT_TRIGGER_SECRET }}" \
            "${{ secrets.TELEGRAM_BOT_WEBHOOK_URL }}/trigger/inserto"
