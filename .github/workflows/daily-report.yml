name: Gazzettino giornaliero Telegram

on:
  schedule:
    # 01:00 UTC = 03:00 ora italiana con ora legale (02:00 con ora solare).
    # Il report riepiloga sempre il giorno precedente.
    - cron: "17 01 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Data da riepilogare (YYYY-MM-DD). Vuoto = ieri."
        required: false
        default: ""
      format:
        description: "Formato del report."
        required: false
        default: "newspaper"
        type: choice
        options:
          - newspaper
          - text
      list_topics:
        description: "Elenca i topic del gruppo con i loro ID, senza inviare nulla."
        required: false
        default: false
        type: boolean

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Genera e invia il gazzettino
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          # Il disegno della vignetta. Vuote = si genera sull'apertura del
          # giorno, con gpt-image-2, e in bianco e nero come la pagina.
          GENERATE_AI_VIGNETTA: ${{ vars.GENERATE_AI_VIGNETTA }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          VIGNETTA_BIANCO_E_NERO: ${{ vars.VIGNETTA_BIANCO_E_NERO }}
          REPORT_DESTINATION: ${{ vars.REPORT_DESTINATION }}
          REPORT_TOPIC_ID: ${{ vars.REPORT_TOPIC_ID }}
          REPORT_TIMEZONE: ${{ vars.REPORT_TIMEZONE }}
          NEWSPAPER_NAME: ${{ vars.NEWSPAPER_NAME }}
          # Dove arriva il conto dell'edizione, e con che listino. Vuote =
          # i Messaggi salvati e i prezzi di report/spesa.py.
          SPESA_DESTINATION: ${{ vars.SPESA_DESTINATION }}
          PREZZO_INPUT: ${{ vars.PREZZO_INPUT }}
          PREZZO_OUTPUT: ${{ vars.PREZZO_OUTPUT }}
          # Mappa topic -> sezione. Vuote = i valori di report/sections.py:
          # servono solo per correggere una sezione senza toccare il codice.
          REPORT_SECTIONS: ${{ vars.REPORT_SECTIONS }}
          REPORT_SECTION_FAMILIES: ${{ vars.REPORT_SECTION_FAMILIES }}
        run: |
          if [ "${{ github.event.inputs.list_topics }}" = "true" ]; then
            python main.py --list-topics
            exit 0
          fi
          FORMAT="${{ github.event.inputs.format }}"
          FORMAT="${FORMAT:-newspaper}"
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python main.py --date "${{ github.event.inputs.date }}" --format "$FORMAT"
          else
            python main.py --format "$FORMAT"
          fi

      - name: Pubblica l'inserto settimanale (solo di domenica, dopo il gazzettino)
        if: github.event.inputs.list_topics != 'true'
        env:
          TELEGRAM_BOT_WEBHOOK_URL: ${{ secrets.TELEGRAM_BOT_WEBHOOK_URL }}
          TELEGRAM_BOT_TRIGGER_SECRET: ${{ secrets.TELEGRAM_BOT_TRIGGER_SECRET }}
        run: |
          # %u: 1 = lunedi, ... 7 = domenica. L'inserto esce lo stesso giro
          # notturno del gazzettino, dopo di lui: stessa edizione, due pezzi.
          if [ "$(date -u +%u)" = "7" ]; then
            curl -sS -X POST \
              --fail \
              -H "X-Trigger-Secret: $TELEGRAM_BOT_TRIGGER_SECRET" \
              "$TELEGRAM_BOT_WEBHOOK_URL/trigger/inserto"
          else
            echo "Non e' domenica: nessun inserto da pubblicare oggi."
          fi
