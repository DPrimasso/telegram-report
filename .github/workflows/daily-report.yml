name: Gazzettino giornaliero Telegram

on:
  schedule:
    # 01:00 UTC = 03:00 ora italiana con ora legale (02:00 con ora solare).
    # Il report riepiloga sempre il giorno precedente.
    - cron: "00 01 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Data da riepilogare (YYYY-MM-DD). Vuoto = ieri."
        required: false
        default: ""
      format:
        description: "Formato del report."
        required: false
        default: "newspaper"
        type: choice
        options:
          - newspaper
          - text
      list_topics:
        description: "Elenca i topic del gruppo con i loro ID, senza inviare nulla."
        required: false
        default: false
        type: boolean

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Genera e invia il gazzettino
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPORT_DESTINATION: ${{ vars.REPORT_DESTINATION }}
          REPORT_TOPIC_ID: ${{ vars.REPORT_TOPIC_ID }}
          REPORT_TIMEZONE: ${{ vars.REPORT_TIMEZONE }}
          NEWSPAPER_NAME: ${{ vars.NEWSPAPER_NAME }}
        run: |
          if [ "${{ github.event.inputs.list_topics }}" = "true" ]; then
            python main.py --list-topics
            exit 0
          fi
          FORMAT="${{ github.event.inputs.format }}"
          FORMAT="${FORMAT:-newspaper}"
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python main.py --date "${{ github.event.inputs.date }}" --format "$FORMAT"
          else
            python main.py --format "$FORMAT"
          fi
